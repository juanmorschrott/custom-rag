spring:
  application:
    name: custom-rag-backend

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_CHAT_MODEL:phi4:latest}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:embeddinggemma:latest}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${EMBEDDING_DIMENSIONS:768}
        distance-type: COSINE_DISTANCE

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/custom_rag}
    username: ${SPRING_DATASOURCE_USERNAME:custom_rag}
    password: ${SPRING_DATASOURCE_PASSWORD:custom_rag}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  ingestion:
    books-directory: ${BOOKS_DIRECTORY:../data/books}
    chunk-size: ${INGESTION_CHUNK_SIZE:4000}
    chunk-overlap: ${INGESTION_CHUNK_OVERLAP:400}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
